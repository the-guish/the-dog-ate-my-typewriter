<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-labelledby="t">
  <title id="t">The test pyramid, with mostly unit tests, next to the testing trophy, with mostly integration tests</title>
  <style>
    .shape { stroke: #222; stroke-width: 1.5; stroke-linejoin: round; }
    .light { fill: #eeeeea; } .mid { fill: #c8c8c4; } .main { fill: #555; }
    text { fill: #222; text-anchor: middle; dominant-baseline: middle; }
    text.on-main { fill: #fff; font-weight: bold; }
    text.caption { font-size: 15px; font-weight: bold; }
    text.note { font-size: 12px; fill: #666; }
    @media (prefers-color-scheme: dark) {
      .shape { stroke: #ddd; }
      .light { fill: #262626; } .mid { fill: #444; } .main { fill: #ccc; }
      text { fill: #ddd; } text.on-main { fill: #111; } text.note { fill: #999; }
    }
  </style>
  <polygon class="shape light" points="160,20 203,100 117,100"/>
  <text x="160" y="80" font-size="13">UI</text>
  <polygon class="shape mid" points="117,100 203,100 246,180 74,180"/>
  <text x="160" y="146" font-size="15">Service</text>
  <polygon class="shape main" points="74,180 246,180 300,280 20,280"/>
  <text x="160" y="240" font-size="22" class="on-main">Unit</text>
  <polygon class="shape light" points="489,12 591,60 387,60"/>
  <text x="490" y="46" font-size="13">End to end</text>
  <polygon class="shape main" points="387,60 591,60 624,104 591,148 387,148 354,104"/>
  <text x="490" y="107" font-size="22" class="on-main">Integration</text>
  <polygon class="shape mid" points="387,148 591,148 508,196 470,196"/>
  <text x="490" y="174" font-size="13">Unit</text>
  <polygon class="shape light" points="470,196 508,196 562,287 416,287"/>
  <text x="490" y="256" font-size="14">Static</text>
  <text class="caption" x="160" y="300">Test pyramid</text>
  <text class="note" x="160" y="318">Mike Cohn, 2009</text>
  <text class="caption" x="490" y="300">Testing trophy</text>
  <text class="note" x="490" y="318">Kent C. Dodds, 2018</text>
</svg>
