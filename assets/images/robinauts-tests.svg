<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-labelledby="t">
  <title id="t">Robinauts backend tests by lines of code: adapters widest, then unit and api, e2e narrowest, with the fast suite beside api as an extra copy</title>
  <style>
    .shape { stroke: #222; stroke-width: 1.5; stroke-linejoin: round; }
    .extra { stroke-dasharray: 6 4; }
    .light { fill: #eeeeea; } .mid { fill: #c8c8c4; } .main { fill: #555; }
    text { fill: #222; text-anchor: middle; dominant-baseline: middle; font-size: 13px; }
    text.on-main { fill: #fff; font-weight: bold; }
    text.caption { font-size: 15px; font-weight: bold; }
    text.note { font-size: 12px; fill: #666; }
    @media (prefers-color-scheme: dark) {
      .shape { stroke: #ddd; }
      .light { fill: #262626; } .mid { fill: #444; } .main { fill: #ccc; }
      text { fill: #ddd; } text.on-main { fill: #111; } text.note { fill: #999; }
    }
  </style>
  <rect class="shape light" x="103" y="20" width="83" height="60"/>
  <text x="145" y="42">e2e</text>
  <text x="145" y="60">~750</text>
  <rect class="shape mid" x="84" y="80" width="122" height="60"/>
  <text x="145" y="102">api</text>
  <text x="145" y="120">~1,100</text>
  <rect class="shape main" x="20" y="140" width="250" height="60"/>
  <text x="145" y="162" class="on-main">adapters</text>
  <text x="145" y="180" class="on-main">~2,250</text>
  <rect class="shape mid" x="81" y="200" width="128" height="60"/>
  <text x="145" y="222">unit</text>
  <text x="145" y="240">~1,150</text>
  <rect class="shape light extra" x="290" y="80" width="139" height="60"/>
  <text x="359" y="102">fast</text>
  <text x="359" y="120">~1,250</text>
  <text class="note" x="359" y="158">extra copy,</text>
  <text class="note" x="359" y="174">runs first</text>
  <text class="caption" x="220" y="300">Robinauts backend tests</text>
  <text class="note" x="220" y="318">width = lines of test code, October 2026</text>
</svg>
